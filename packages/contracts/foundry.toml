[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
via_ir = true
fs_permissions = [{ access = "read", path = "../protocol/fixtures" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
multiline_func_header = "params_first"
